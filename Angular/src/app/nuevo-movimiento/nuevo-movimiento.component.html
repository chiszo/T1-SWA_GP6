<section class="card mt-4" aria-labelledby="titulo-nuevo-movimiento">
    <div class="card-body p-4">
      <h2 id="titulo-nuevo-movimiento" class="fs-5 fw-bold mb-3">
        Nuevo movimiento
      </h2>

      <form class="row g-3 align-items-end">
        <div class="col-12 col-md-4">
          <label for="tipo" class="form-label">Tipo</label>

          <select id="tipo" name="tipo" class="form-select" [value]="tipo" (input)="actualizarTipo($event)" required>
            <option value="" disabled selected>Selecciona un tipo</option>
            <option value="Recarga">Recarga</option>
            <option value="Gasto">Gasto</option>
          </select>
        </div>

        <div class="col-12 col-md-4">
          <label for="monto" class="form-label">Monto (S/)</label>
          <input 
          type="number" 
          class="form-control" 
          [value]="monto === 0 ? '' : monto" 
          (input)="actualizarMonto($event)" 
          placeholder="0.00" 
          min="0.01"
          >
        </div>
        <div class="col-12 col-md-4">
          <button type="button" class="btn btn-primary w-100" [disabled]="esInvalido()" (click)="registrar()">
            Registrar movimiento
          </button>
          @if (tipo === 'Gasto' && monto > saldo()) {
          <div class="text-danger small mt-2">
          El monto del gasto no puede superar el saldo actual.
          </div>
          }
        </div>
      </form>
    </div>
  </section>
